# Publishes the site to GitHub Pages. It runs ONLY when started by hand
# (Actions › Deploy › Run workflow), and only works once Pages is turned on with
# "GitHub Actions" as its source. Nothing publishes on push.
#
# dist/ is the root of oneamendez.github.io: crate's site in dist/crate/, and
# the root's own page beside it (scripts/site-root.mjs).
name: Deploy

on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}crate/
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

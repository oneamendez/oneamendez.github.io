# On every push: no image or video may carry metadata, and the site must build.
# This deploys nothing.
name: Check

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: No metadata in images or videos
        run: node scripts/check-media.mjs
      - name: Build
        run: npm run build
